<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesion · Demo Auth</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="contenedor">
    <div class="card">
      <h1>Iniciar sesion</h1>
      <p class="subtitulo">Autenticacion con sesiones, cookies HTTP-Only, CSRF, 2FA y mas</p>

      <form id="form-login">
        <label for="email">Correo electronico</label>
        <input type="email" id="email" name="email" placeholder="estudiante@demo.com" required autocomplete="username" />

        <label for="password">Contrasena</label>
        <div class="input-con-boton">
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" class="btn-toggle-vis" id="toggle-pass" aria-label="Mostrar contrasena">&#128065;</button>
        </div>

        <button type="submit" class="btn-primario" id="btn-login">Entrar</button>
      </form>

      <div id="alerta-error" class="alerta alerta--error"></div>
      <div id="alerta-exito" class="alerta alerta--exito"></div>

      <p class="texto-pie">
        <a class="enlace" href="recuperar.html">Olvidaste tu contrasena?</a>
      </p>
      <p class="texto-pie">
        ¿No tienes cuenta? <a class="enlace" href="registro.html">Registrate</a>
      </p>
      <p class="texto-pie" style="margin-top:4px;font-size:0.8rem;">
        <code>estudiante@demo.com / Aprender123!</code><br/>
        <code>admin@demo.com / AdminSeguro123!</code>
      </p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
