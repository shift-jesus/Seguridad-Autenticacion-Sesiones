<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi perfil · Demo Auth</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="contenedor card--ancho">
    <div class="card card--ancho">
      <div class="header-dashboard">
        <div>
          <h1>Mi perfil</h1>
          <span class="chip-rol" id="chip-rol">rol</span>
        </div>
        <button class="btn-secundario" id="btn-volver">&#8592; Volver</button>
      </div>

      <div class="grid-secciones">
        <div class="panel">
          <h2 style="font-size:1rem;">Datos basicos</h2>
          <form id="form-perfil" class="col-form">
            <label for="perfil-nombre">Nombre</label>
            <input type="text" id="perfil-nombre" required minlength="2" />
            <label for="perfil-email">Email</label>
            <input type="email" id="perfil-email" disabled />
            <p class="nota-fecha" id="perfil-creado"></p>
            <button type="submit" class="btn-primario btn-inline" id="btn-perfil">Guardar</button>
          </form>
        </div>

        <div class="panel">
          <h2 style="font-size:1rem;">Autenticacion</h2>
          <div id="seccion-2fa">
            <p class="subtitulo">Estado 2FA: <strong id="estado-2fa">...</strong></p>
            <div id="2fa-activo" style="display:none;">
              <form id="form-desactivar-2fa" class="col-form">
                <label for="codigo-desactivar">Codigo TOTP</label>
                <input type="text" id="codigo-desactivar" required />
                <button type="submit" class="btn-secundario btn-inline">Desactivar 2FA</button>
              </form>
            </div>
            <div id="2fa-inactivo" style="display:none;">
              <form id="form-configurar-2fa" class="col-form">
                <label for="pass-2fa">Confirma tu contrasena</label>
                <input type="password" id="pass-2fa" required />
                <button type="submit" class="btn-primario btn-inline">Configurar 2FA</button>
              </form>
            </div>
          </div>
          <div id="2fa-setup" style="display:none;">
            <h3 style="font-size:0.9rem;">Escanea el QR con tu app TOTP (Google Authenticator, etc.)</h3>
            <img id="qr-img" alt="QR de 2FA" style="max-width:200px;" />
            <p class="nota-fecha" id="secreto-2fa"></p>
            <form id="form-activar-2fa" class="col-form">
              <label for="codigo-activar">Ingresa el codigo de 6 digitos</label>
              <input type="text" id="codigo-activar" required placeholder="123456" />
              <button type="submit" class="btn-primario btn-inline">Activar 2FA</button>
            </form>
          </div>
          <div id="backup-codes" style="display:none;" class="caja-codigos">
            <h3 style="font-size:0.9rem;">Guarda estos codigos de respaldo (solo se muestran una vez)</h3>
            <code id="lista-backup"></code>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2 style="font-size:1rem;">Cambiar contrasena</h2>
        <form id="form-password" class="col-form">
          <label for="pass-actual">Contrasena actual</label>
          <input type="password" id="pass-actual" required />
          <label for="pass-nueva">Contrasena nueva</label>
          <input type="password" id="pass-nueva" required minlength="8" />
          <button type="submit" class="btn-secundario btn-inline">Cambiar contrasena</button>
        </form>
      </div>

      <div class="panel border-top">
        <h2 style="font-size:1rem;">Mis datos (GDPR)</h2>
        <div class="fila-form">
          <button class="btn-secundario btn-inline" id="btn-exportar">Exportar mis datos</button>
          <button class="btn-peligro-solid" id="btn-eliminar-cuenta">Eliminar mi cuenta</button>
        </div>
      </div>

      <div id="alerta-error" class="alerta alerta--error"></div>
      <div id="alerta-exito" class="alerta alerta--exito"></div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
