<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recuperar contrasena · Demo Auth</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="contenedor">
    <div class="card">
      <h1>Recuperar contrasena</h1>
      <p class="subtitulo" id="intro">Si el email esta registrado, recibiras un enlace (revisa la consola del servidor en la demo).</p>

      <form id="form-recuperar" style="display:none;">
        <label for="email">Correo electronico</label>
        <input type="email" id="email" required />
        <button type="submit" class="btn-primario" id="btn-enviar">Enviar enlace</button>
      </form>

      <form id="form-reset" style="display:none;">
        <label for="token">Token de verificacion</label>
        <input type="text" id="token" required placeholder="Pega el token aqui" />
        <label for="password">Nueva contrasena</label>
        <input type="password" id="password" required minlength="8" />
        <button type="submit" class="btn-primario" id="btn-reset">Restablecer</button>
      </form>

      <div id="alerta-error" class="alerta alerta--error"></div>
      <div id="alerta-exito" class="alerta alerta--exito"></div>
      <p class="texto-pie"><a class="enlace" href="index.html">Volver al login</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const tokenParam = params.get('token');
    const formRecuperar = document.getElementById('form-recuperar');
    const formReset = document.getElementById('form-reset');
    const alertaError = document.getElementById('alerta-error');
    const alertaExito = document.getElementById('alerta-exito');
    function mostrar(mensajes, tipo) {
      alertaError.style.display='none';
      alertaExito.style.display='none';
      const el = tipo==='error'?alertaError:alertaExito;
      el.textContent = Array.isArray(mensajes)?mensajes.join('. '):mensajes;
      el.style.display='block';
    }

    if(tokenParam){
      document.getElementById('token').value = tokenParam;
      document.getElementById('intro').textContent = 'Ingresa tu nuevo password.';
      formReset.style.display='';
    } else {
      formRecuperar.style.display='';
    }

    formRecuperar.addEventListener('submit', async(e)=>{
      e.preventDefault();
      try{
        const r = await Api.recuperar({email: document.getElementById('email').value.trim()});
        mostrar(r.mensaje, 'exito');
        formRecuperar.style.display='none';
      }catch(err){
        mostrar(err.detalles?.error||err.message, 'error');
      }
    });

    formReset.addEventListener('submit', async(e)=>{
      e.preventDefault();
      try{
        const r = await Api.recuperarReset({
          token: document.getElementById('token').value.trim(),
          password: document.getElementById('password').value
        });
        mostrar(r.mensaje, 'exito');
        formReset.style.display='none';
      }catch(err){
        mostrar(err.detalles?.error||err.message, 'error');
      }
    });
  </script>
</body>
</html>
