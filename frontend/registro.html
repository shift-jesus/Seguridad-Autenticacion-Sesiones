<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crear cuenta · Demo Auth</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="contenedor">
    <div class="card">
      <h1>Crear cuenta</h1>
      <p class="subtitulo">Tu contrasena se guarda hasheada (bcrypt), nunca en texto plano</p>

      <form id="form-registro" novalidate>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required />

        <label for="email">Correo electronico</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required autocomplete="username" />

        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" placeholder="Min. 8, mayuscula, numero y simbolo" required minlength="8" autocomplete="new-password" />
        <div class="fuerza" id="fuerza-medidor">
          <span id="fuerza-barra"></span>
        </div>
        <ul class="requisitos" id="req-lista">
          <li id="req-len">8+ caracteres</li>
          <li id="req-may">Mayuscula</li>
          <li id="req-min">Minuscula</li>
          <li id="req-num">Numero</li>
          <li id="req-sim">Simbolo</li>
        </ul>

        <button type="submit" class="btn-primario" id="btn-registro">Crear cuenta</button>
      </form>

      <div id="alerta-error" class="alerta alerta--error"></div>
      <div id="alerta-exito" class="alerta alerta--exito"></div>

      <p class="texto-pie">
        ¿Ya tienes cuenta? <a class="enlace" href="index.html">Inicia sesion</a>
      </p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
