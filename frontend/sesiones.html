<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mis dispositivos · Demo Auth</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="contenedor card--ancho">
    <div class="card card--ancho">
      <div class="header-dashboard">
        <div>
          <h1>Mis dispositivos</h1>
          <span class="chip-rol" id="chip-rol">rol</span>
        </div>
        <button class="btn-secundario" id="btn-volver">&#8592; Volver</button>
      </div>
      <p class="subtitulo">Sesiones activas en tu cuenta. Puedes revocar las que no reconozcas.</p>

      <div class="fila-form">
        <button class="btn-peligro-solid" id="btn-cerrar-todas">Cerrar sesion en todos los demas dispositivos</button>
      </div>

      <ul id="lista-sesiones" class="lista-simple"></ul>
      <div id="alerta-error" class="alerta alerta--error"></div>
      <div id="alerta-exito" class="alerta alerta--exito"></div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/sesiones.js"></script>
</body>
</html>
