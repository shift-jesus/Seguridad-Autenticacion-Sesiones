<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · Demo Auth</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="contenedor card--ancho">
    <div class="card card--ancho">
      <div class="header-dashboard">
        <div>
          <h1 id="saludo">Hola 👋</h1>
          <span class="chip-rol" id="chip-rol">rol</span>
        </div>
        <div class="acciones-header">
          <button class="btn-secundario" id="btn-notif" title="Notificaciones">&#128276; <span id="badge-notif" class="badge oculto">0</span></button>
          <button class="btn-secundario" id="btn-tema" title="Cambiar tema">&#127769;</button>
          <button class="btn-secundario" id="btn-logout">Cerrar sesion</button>
        </div>
      </div>

      <div id="banner-verificar" class="alerta alerta--exito oculto" style="display:none;">
        <span>Te falta verificar tu email.</span>
        <a href="#" id="enlace-verificar">Revisa la consola del servidor.</a>
      </div>

      <div id="aviso-2fa" class="alerta alerta--exito oculto" style="display:none;">Activa 2FA desde <a class="enlace" href="perfil.html">Mi perfil</a>.</div>

      <p class="subtitulo" id="info-sesion">Cargando datos de sesion...</p>

      <div class="grid-info">
        <div class="stat"><span class="valor" id="stat-visitas">-</span><span class="etiqueta">Visitas (demo)</span></div>
        <div class="stat"><span class="valor" id="stat-notif">-</span><span class="etiqueta">Notificaciones (demo)</span></div>
      </div>

      <nav class="nav-tabs">
        <a class="enlace" href="perfil.html">Mi perfil</a>
        <a class="enlace" href="sesiones.html">Mis dispositivos</a>
        <a class="enlace oculto" href="admin.html" id="lnk-admin">Panel admin</a>
      </nav>

      <div class="panel">
        <h2 style="font-size:1rem;">Mis notas</h2>
        <div class="barra-busqueda">
          <input type="search" id="buscar-notas" placeholder="Buscar en notas o etiquetas" />
        </div>
        <form id="form-nota" class="fila-form">
          <input type="text" id="input-nota" placeholder="Escribe una nota..." maxlength="500" required />
          <input type="text" id="input-etiqueta" placeholder="etiqueta (opcional)" maxlength="30" />
          <button type="submit" class="btn-primario btn-inline" id="btn-crear-nota">Agregar</button>
        </form>
        <ul id="lista-notas" class="lista-simple"></ul>
      </div>

      <div class="panel">
        <h2 style="font-size:1rem;">Actividad reciente</h2>
        <ul id="lista-actividad" class="lista-simple"></ul>
      </div>

      <div id="alerta-error" class="alerta alerta--error"></div>
      <div id="alerta-exito" class="alerta alerta--exito"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
